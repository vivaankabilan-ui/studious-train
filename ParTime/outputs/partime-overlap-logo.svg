<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ParTime PT logo</title>
  <desc id="desc">Two overlapping rounded squares: a green square with a white P and a white square with a green T.</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0b6b4f" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="green-fill" x1="92" y1="82" x2="306" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a936f"/>
      <stop offset="1" stop-color="#0b6b4f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#f4fcf8"/>

  <g filter="url(#soft-shadow)">
    <rect x="62" y="82" width="226" height="226" rx="54" fill="url(#green-fill)"/>
    <rect x="224" y="204" width="226" height="226" rx="54" fill="#ffffff" stroke="#cfe3dd" stroke-width="10"/>
  </g>

  <path d="M224 204h36c15.5 0 28 12.5 28 28v76h-64V204z" fill="#0a5f46" opacity="0.16"/>

  <text x="168" y="246"
        text-anchor="middle"
        font-family="Verdana, Aptos, Arial, sans-serif"
        font-size="148"
        font-weight="900"
        fill="#ffffff"
        letter-spacing="-8">P</text>

  <text x="338" y="374"
        text-anchor="middle"
        font-family="Verdana, Aptos, Arial, sans-serif"
        font-size="148"
        font-weight="900"
        fill="#0b6b4f"
        letter-spacing="-8">T</text>
</svg>
